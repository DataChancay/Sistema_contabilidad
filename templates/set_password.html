{% extends "auth_base.html" %}
{% set title = "Definir contrasena | Contabilidad Chancay" %}
{% block body %}
<main class="auth-page">
  <section class="auth-panel" aria-labelledby="password-title">
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true">CC</span>
      <span class="brand-copy"><strong>Contabilidad</strong><span>Chancay</span></span>
    </div>
    <h1 id="password-title">Definir contrasena</h1>
    {% include "_flash.html" %}
    <form method="post" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Nueva contrasena <input name="password" type="password" autocomplete="new-password" minlength="12" required /></label>
      <label>Confirmar contrasena <input name="password_confirmation" type="password" autocomplete="new-password" minlength="12" required /></label>
      <button class="primary-button" type="submit">Guardar contrasena</button>
    </form>
  </section>
</main>
{% endblock %}
