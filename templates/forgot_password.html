{% extends "auth_base.html" %}
{% set title = "Recuperar acceso | Contabilidad Chancay" %}
{% block body %}
<main class="auth-page">
  <section class="auth-panel" aria-labelledby="forgot-title">
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true">CC</span>
      <span class="brand-copy"><strong>Contabilidad</strong><span>Chancay</span></span>
    </div>
    <h1 id="forgot-title">Recuperar acceso</h1>
    {% include "_flash.html" %}
    <form method="post" action="{{ url_for('auth.forgot_password_post') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Correo electronico <input name="email" type="email" autocomplete="email" required /></label>
      <button class="primary-button" type="submit">Enviar instrucciones</button>
    </form>
    <a class="text-link" href="{{ url_for('auth.login') }}">Volver al login</a>
  </section>
</main>
{% endblock %}
